<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500|Roboto:300,400,500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />

    <title>30 Days Of React App</title>

    <style>
        * {
          box-sizing: border-box;
          padding: 0;
          margin: 0;
        }

        html,
        body {
          height: 100%;
          line-height: 1.5;
          font-family: 'Montserrat';
          font-weight: 300;
          color: black;
        }

        #root {
          min-height: 100%;
          position: relative;
        }

        .header-wrapper,
        .main-wrapper,
        .footer-wrapper {
          width: 85%;
          margin: auto;
        }

        .header-wrapper,
        .main-wrapper {
          padding: 10px;
          margin: 2px auto;
        }

        h1 {
          font-size: 70px;
          font-weight: 300;
        }

        h2,
        h3 {
          font-weight: 300;
        }

        header {
          background-color: #61dbfb;
          padding: 10px;
        }

        main {
          padding: 10px;
          padding-bottom: 60px;
          /* Height of the footer */
        }

        ul {
          margin-left: 15px;
        }

        ul li {
          list-style: none;
        }

        footer {
          position: absolute;
          bottom: 0;
          width: 100%;
          height: 60px;
          background: #6cf;
        }

        .submit-styles {
          background: rgb(238, 124, 83);
          width: 300px;
          height: 40px;
          border: none;
          border-radius: 5px;
          margin-top: 20px;
          color: white;
        }

        .usercard-wrapper {
          margin-top: 50px;
          background-color: rgb(166, 214, 238);
          padding: 35px;
          border-radius: 35px;
          margin-bottom: 20px;
        }

        .avatar-frame {
          width: 180px;
          height: 180px;
          background-color: white;
          border-radius: 50%;
          margin-bottom: 20px;
        }

        .image-styles {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        .usercard-name-styles {
          font-family: 'segoe ui';
          font-weight: bolder;
          text-transform: uppercase;
          letter-spacing: 10%;
          margin-bottom: 20px;
        }

        .icons-styles {
          scale: 80%;
          vertical-align: -11%;
        }

        .usercard-title-styles {
          font-family: 'segoe ui';
        }

        .usercard-title-container {
          margin-bottom: 20px;
        }

        .skills-container {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-bottom: 20px;
          padding-left: 15px;
        }

        .skills-styles {
          padding: 6px 10px;
          border-radius: 12px;
          background: white;
        }

        .joindate-styles {
          font-family: 'segoe ui';
        }

        input {
          padding-inline: 20px;
          padding-bottom: 10px;
          padding-top: 10px;
          border: none;
          border-radius: 5px;
        }
        
        .input-styles {
          display: flex;
          margin-top: 40px;
          justify-content: space-between;
          width: 72%;
          justify-self: center;
        }

        .footer-wrapper {
          font-weight: 400;
          text-align: center;
          line-height: 60px;
        }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
